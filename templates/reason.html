<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deny Request</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      padding: 30px;
      color: #8A0000;
    }
    .container {
      max-width: 600px;
      background-color: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      color: #C83F12;
    }
    .btn-danger {
      background-color: #8A0000;
      border-color: #8A0000;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 class="mb-4">Deny Request</h2>
    <form method="POST" action="{{ url_for('deny_request', request_id=request_id) }}">
      <div class="mb-3">
        <label for="reason" class="form-label">Reason for Denial:</label>
        <textarea class="form-control" id="reason" name="reason" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-danger">Submit Reason</button>
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>

</body>
</html>
